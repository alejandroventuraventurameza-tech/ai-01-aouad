name: Lean 4 — Proposition 2.1 formal verification

on:
  push:
    branches:
      - work/repository1-proposition21-audit
    paths:
      - Aouad.lean
      - Aouad/**
      - lean-toolchain
      - lakefile.toml
      - lake-manifest.json
      - .github/workflows/lean.yml
  workflow_dispatch:

concurrency:
  group: aouad-lean-repository1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies only if lockfile is missing
        run: |
          if ! test -s lake-manifest.json; then
            lake update
          fi
          test -s lake-manifest.json
          echo "Resolved Mathlib versions in lake-manifest.json"
      - name: Build Lean and audit declared axioms
        uses: leanprover/lean-action@v1.7.1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          mk_all-check: false
          axiom-audit: true
          axiom-audit-root: Aouad
      - name: Freeze exactly the manifest used by the successful build
        if: github.ref == 'refs/heads/work/repository1-proposition21-audit'
        run: |
          test -s lake-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lake-manifest.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile already committed"
          else
            git commit -m "build(lean): lock audited Lake dependency revisions [skip ci]"
            git push origin HEAD:work/repository1-proposition21-audit
          fi
