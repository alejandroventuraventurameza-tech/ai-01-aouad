name: Lean 4 — Proposition 2.1 conditional checks

on:
  push:
    branches:
      - work/repository1-proposition21-audit
    paths:
      - Aouad.lean
      - Aouad/**
      - lean-toolchain
      - lakefile.toml
      - lake-manifest.json
      - .github/workflows/lean.yml
  workflow_dispatch:

concurrency:
  group: aouad-lean-repository1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan to initialize the Lake workspace
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate the pinned Mathlib dependency manifest
        run: |
          lake update
          test -s lake-manifest.json
      - name: Lean + Mathlib build and axiom audit
        uses: leanprover/lean-action@v1.7.1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          mk_all-check: false
          axiom-audit: true
          axiom-audit-root: Aouad
