name: Build original Beamer PDF

on:
  push:
    branches:
      - work/repository1-proposition21-audit
    paths:
      - presentation.tex
      - .github/workflows/beamer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compile Beamer from source
        uses: xu-cheng/latex-action@v3
        with:
          root_file: presentation.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Check and commit compiled PDF
        run: |
          test -s presentation.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f presentation.pdf
          if ! git diff --cached --quiet; then
            git commit -m "build(pdf): synchronize independently authored Beamer deck [skip ci]"
            git push origin HEAD:work/repository1-proposition21-audit
          else
            echo "PDF already up to date"
          fi
