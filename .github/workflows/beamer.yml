name: Build original Beamer PDF

on:
  push:
    branches:
      - work/repository1-proposition21-audit
    paths:
      - presentation.tex
      - .github/workflows/beamer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compile Beamer from source
        uses: xu-cheng/latex-action@v3
        with:
          root_file: presentation.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Commit PDF only against its matching source revision
        run: |
          test -s presentation.pdf
          cp presentation.pdf /tmp/aouad-presentation.pdf
          BRANCH=work/repository1-proposition21-audit
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if ! git diff --quiet HEAD "origin/$BRANCH" -- presentation.tex; then
            echo "TeX source changed while compiling; skip this stale PDF"
            exit 0
          fi
          git reset --hard "origin/$BRANCH"
          cp /tmp/aouad-presentation.pdf presentation.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f presentation.pdf
          if ! git diff --cached --quiet; then
            git commit -m "build(pdf): synchronize original Beamer deck [skip ci]"
            git push origin HEAD:"$BRANCH"
          else
            echo "PDF already up to date"
          fi
